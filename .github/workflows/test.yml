name: test

# Runs the tests on every push and pull request, with no secrets and read-only
# access. (Pull requests opened by the forge's own token do not trigger
# workflows, a GitHub rule; the forge runs the tests itself and puts the result
# in the PR. Re-run this from the Actions tab, or push a commit, to check again.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test forge/run.test.mjs
      - run: npm test
